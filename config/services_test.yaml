services:
    pii_radar.test.demo_cassette:
        class: Symfony\AI\Platform\Test\Replay\HttpCassette
        arguments:
            - '%kernel.project_dir%/tests/Fixtures/cassettes/demo-arbitration.json'
            - []
            - !service { class: Symfony\AI\Platform\Test\Replay\BodyRedactor }

    pii_radar.test.cassette_http_client:
        class: Symfony\AI\Platform\Test\Replay\CassetteHttpClient
        arguments: ['@pii_radar.test.demo_cassette', '@App\Infrastructure\Ai\Http\ErrorBodyRecordingHttpClient']
