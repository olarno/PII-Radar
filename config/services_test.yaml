parameters:
    pii_radar.report_directory: '%kernel.cache_dir%/pii-radar'

services:
    # Tests take the path of "pii:scan --replay": the recorded run answers, recorded again when the file is deleted.
    App\Infrastructure\Ai\Http\ReplayableHttpClient:
        arguments: ['@http_client']
        calls:
            - replay: ['%pii_radar.agent_replay%']
