# PII Radar MCP server: tools, resources and prompts are discovered in src/Infrastructure/Mcp
# (#[McpTool], #[McpResource], #[McpResourceTemplate], #[McpPrompt]). They read the last stored scan.
mcp:
    servers:
        pii_radar:
            name: 'PII Radar'
            description: 'Ask where personal data lives in the audited application and whether a field may be logged.'
            instructions: >-
                PII Radar knows where the audited application stores, logs and sends personal data.
                Before writing code that touches a database column, call pii_where_is; before adding a log, call pii_can_i_log.
                Use pii_findings to list the risks to fix. pii_scan re-runs a scan and may call an LLM: use it only after changing the code.
            registry: ['App\Infrastructure\Mcp\']
            transports:
                stdio: true
                http: true
