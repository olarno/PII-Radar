# Symfony AI: every LLM call goes through the Platform component.
# Hugging Face Inference Providers is the default platform (decision 2).
ai:
    platform:
        huggingface:
            api_key: '%env(HUGGINGFACE_API_KEY)%'
            # Keeps the provider's error bodies, which the converter would reduce to "Bad Request".
            http_client: App\Infrastructure\Ai\Http\ErrorBodyRecordingHttpClient

    # Arbitration runs in two steps, because providers reject "tools" and "response_format" in the same request.
    agent:
        # 1. Investigates the candidates the name heuristic is unsure about, with its tools.
        arbiter:
            platform: 'ai.platform.huggingface'
            model: '%env(PII_RADAR_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/arbiter.md'
            tools:
                services:
                    - { service: App\Infrastructure\Ai\Tool\DescribeTableTool }
                    - { service: App\Infrastructure\Ai\Tool\FindColumnUsagesTool }
                    - { service: App\Infrastructure\Ai\Tool\ReadCodeSnippetTool }
            fault_tolerant_toolbox: true
            # Budget guard: 4 candidates on the demo need far fewer calls.
            max_tool_calls: 12

        # 2. Turns the investigation into structured verdicts, without tools.
        verdicts:
            platform: 'ai.platform.huggingface'
            model: '%env(PII_RADAR_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/verdicts.md'

when@test:
    ai:
        platform:
            huggingface:
                # Replays the recorded Hugging Face exchanges of tests/Fixtures/cassettes (records them when missing).
                http_client: 'pii_radar.test.cassette_http_client'
