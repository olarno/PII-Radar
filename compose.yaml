services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    # Secrets such as HUGGINGFACE_API_KEY are read by Symfony from .env.local (mounted with the code).
    # vendor/ lives in the mounted project and is refreshed by "composer install" at startup.
    volumes:
      - ./:/app
    # Healthy once "composer install" is done and the server answers: "docker compose up -d --wait" waits for it.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(false === @file_get_contents('http://127.0.0.1:8080/health') ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s

  legacy-app:
    build:
      context: .
      dockerfile: docker/legacy-app/Dockerfile
    ports:
      - "${LEGACY_APP_PORT:-8081}:80"
    environment:
      DB_HOST: mariadb
      DB_NAME: clinique
      DB_USER: clinique
      DB_PASSWORD: clinique
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: clinique
      MARIADB_USER: clinique
      MARIADB_PASSWORD: clinique
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ./demo/legacy-app/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
